stages:
  - docker_image
  - build
  - test
  - prepare
  - commit

variables:
  DOCKER_IMAGE_HELPER: ${DOCKER_IMAGE_HELPER_TAGLESS}:v2.0.0

build_image:
  stage: docker_image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - /kaniko/executor
      --cache=true --cache-ttl=168h
      --registry-mirror "${DOCKER_REGISTRY_MIRROR}"
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/.gitlab-ci/${OS}-Dockerfile"
      --destination "${DOCKER_IMAGE}"
  parallel:
    matrix:
      - OS:
          - deb11
          - deb12
          - deb13
          - el8
          - el9
          - el10
          - el10-rpmlint

build-ci-debian:
  stage: build
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - .gitlab-ci/build-debian.sh
  artifacts:
    name: "swprobe-${OS}-${ARCH}-${CI_COMMIT_REF_NAME}"
    paths: # dynamic variables (exported from script) cannot be used
      - ./bookworm
      - ./bullseye
      - ./trixie
  dependencies: [] # Don't download any artifacts
  parallel:
    matrix:
      - ARCH: amd64
        OS:
          - deb11
          - deb12
          - deb13
      - ARCH: arm64
        OS:
          - deb12
          - deb13
        CROSS_ARM64: "true"
  needs:
    - job: build_image
      parallel:
        matrix:
          - OS: ['$[[ matrix.OS ]]']


build-ci-el:
  stage: build
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - .gitlab-ci/build-el.sh
  artifacts:
    name: "swprobe-${OS}-${CI_COMMIT_REF_NAME}"
    paths:
      - ./${OS}
  dependencies: [] # Don't download any artifacts
  parallel:
    matrix:
      - OS:
        - el8
        - el9
        - el10
  needs:
    - job: build_image
      parallel:
        matrix:
          - OS: ['$[[ matrix.OS ]]']

build-ci-manual:
  stage: build
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - .gitlab-ci/build-manual.sh
  dependencies: [] # Don't download any artifacts
  parallel:
    matrix:
      - OS:
        - deb13
  needs:
    - job: build_image
      parallel:
        matrix:
          - OS: ['$[[ matrix.OS ]]']

lint-ci-el:
  stage: test
  only:
    - branches
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - .gitlab-ci/lint-el.sh
  artifacts:
    name: "swprobe-${OS}-${CI_COMMIT_REF_NAME}-lint-report"
    paths:
      - ./lint_report
  dependencies:
    - build-ci-el # Only download artifacts for EL
  parallel:
    matrix:
      - OS:
        - el8
        - el9
        - el10-rpmlint

test-ci-debian:
  stage: test
  only:
    - branches
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - export OS_VERSION="$( . /etc/os-release && echo $VERSION_CODENAME )"
    - cd ${OS_VERSION}/main/binary-${ARCH}
    # Bootstrap current version
    - dpkg-deb --fsys-tarfile ripe-atlas-repo*.deb | tar -xOf - ./usr/share/keyrings/ripe-atlas.pub.gpg.asc > ripe-atlas.pub.gpg.asc
    - 'dpkg-deb --fsys-tarfile ripe-atlas-repo*.deb | tar -xOf - ./etc/apt/sources.list.d/ripe-atlas.sources | sed "s|^Signed-By:.*|Signed-By: $(pwd)/ripe-atlas.pub.gpg.asc|" > /etc/apt/sources.list.d/ripe-atlas-bootstrap.sources'
    - apt update -y
    - apt install -y ripe-atlas-repo
    - rm /etc/apt/sources.list.d/ripe-atlas-bootstrap.sources ripe-atlas.pub.gpg.asc
    # Now use current -repo to test current -probe install
    - apt update -y
    - apt install -y ripe-atlas-probe
    # Upgrade to local build version
    - dpkg -i ripe-atlas-repo*
    - apt update -y # Verify -repo still works
    - apt install -y ripe-atlas-probe # same version from repo (should not update)
    - dpkg -i ripe-atlas-probe* ripe-atlas-common* # local build version (upgrade)
    - apt purge -qqy '^ripe-atlas-.*$'
    - dpkg -i ripe-atlas-probe* ripe-atlas-common* # local build version (install)
  parallel:
    matrix:
      - ARCH: amd64
        OS:
          - deb11
          - deb12
          - deb13
  needs:
    - job: build-ci-debian
      parallel:
        matrix:
          - ARCH: ['$[[ matrix.ARCH ]]']
            OS: ['$[[ matrix.OS ]]']
  allow_failure: true

test-ci-el:
  stage: test
  only:
    - branches
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - export OS_VERSION="$( . /etc/os-release && echo $PLATFORM_ID | cut -d':' -f2 )" # extract el release (e.g. el9)
    - cd ${OS_VERSION}/noarch/
    - rpm -Uvh ripe-atlas-repo*
    - dnf -y install ripe-atlas-probe # current version from repo
    - cd ../
    - dnf -y install */ripe-atlas-common* noarch/ripe-atlas-probe* # update current repo -> built version
    - dnf -y remove 'ripe-atlas-*'
    - rm -r /etc/ripe-atlas/ /var/run/ripe-atlas/ /var/spool/ripe-atlas/
    - dnf -y install */ripe-atlas-common* noarch/ripe-atlas-probe* # built version (install NOT upgrade)
  dependencies:
    - build-ci-el # Only download artifacts for EL
  parallel:
    matrix:
      - OS:
          - el8
          - el9
          - el10
  needs:
    - job: build-ci-el
      parallel:
        matrix:
          - OS: ['$[[ matrix.OS ]]']
  allow_failure: true

test-ci-manual-testsuite:
  stage: test
  only:
    - branches
  image: ${CI_REGISTRY_IMAGE}/${OS}:${CI_COMMIT_REF_SLUG}
  script:
    - .gitlab-ci/build-manual.sh
    - cd probe-busybox/testsuite
    - ./runtest -v
  variables:
    OS: deb13
  needs:
    - job: build-ci-manual
  allow_failure: true

.prepare-ci:
  stage: prepare
  image: ${DOCKER_IMAGE_HELPER}
  script:
    - source /helper/ci/ci.sh
    - init "${distcode}"
    - prepare
  artifacts:
    name: "${distcode}-deployable-${CI_COMMIT_REF_NAME}"
    paths:
      - ./${distcode}-deployable
  needs: # skips waiting on lint + only downloads build-ci artifacts
    - job: build-ci-debian
    - job: build-ci-el
  parallel:
    matrix:
      - distcode:
          - el8
          - el9
          - el10
      - distcode:
          - bullseye
          - bookworm
          - trixie

prepare-ci-devel:
    extends: .prepare-ci
    only:
      - /^devel.*/
    environment:
      name: devel

prepare-ci-testing:
    extends: .prepare-ci
    only:
      - /^testing.*/
    environment:
      name: testing

prepare-ci-master:
    extends: .prepare-ci
    only:
      - /^master$/
    environment:
      name: master

approve-ci:
  stage: commit
  only:
    - /^devel.*/
    - /^testing.*/
    - /^master$/
  script: ':'
  when: manual

.commit-ci:
  stage: commit
  image: ${DOCKER_IMAGE_HELPER}
  script:
    - source /helper/ci/ci.sh
    - commit "${distcode}-deployable"
  parallel:
    matrix:
      - distcode:
          - el8
          - el9
          - el10
      - distcode:
          - bullseye
          - bookworm
          - trixie
  resource_group: commit

commit-ci-devel:
    needs:
        - job: prepare-ci-devel
          artifacts: true
        - job: approve-ci
    only:
      - /^devel.*/
    extends: .commit-ci
    environment:
      name: devel

commit-ci-testing:
    needs:
        - job: prepare-ci-testing
          artifacts: true
        - job: approve-ci
    only:
      - /^testing.*/
    extends: .commit-ci
    environment:
      name: testing

commit-ci-master:
    needs:
        - job: prepare-ci-master
          artifacts: true
        - job: approve-ci
    only:
      - /^master$/
    extends: .commit-ci
    environment:
      name: master

.changelog:
  image: python:3.11-alpine
  stage: prepare
  script:
    - apk add git bash
    - export SOFTWARE_PROBE_REPO="${PWD}"
    - git clone ${CHANGELOG_REPO}
    - $CHANGELOG
  artifacts:
    name: changelog-${CI_COMMIT_REF_NAME}
    paths:
      - $CHANGELOG_FILE
    when: always # artifacts get produced when job fails
  needs: []

changelog-manual:
  extends: .changelog
  except:
    - master
    - /^testing.*/
  allow_failure: true
  when: manual

changelog-automatic-testing:
  extends: .changelog
  only:
    - /^testing.*/
  allow_failure: true

changelog-automatic-master:
  extends: .changelog
  only:
    - master
  allow_failure: true
